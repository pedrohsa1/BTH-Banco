services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bth_banking
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bth_banking"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    environment:
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=bth_banking;Username=postgres;Password=postgres
      Seed__Enabled: "true"
      Hangfire__Enabled: "true"
      Cors__Origins__0: http://localhost:8080
      Cors__Origins__1: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
